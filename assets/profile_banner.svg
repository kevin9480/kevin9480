<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071A33"/>
    <stop offset="58%" stop-color="#06213A"/>
    <stop offset="100%" stop-color="#007E75"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="72%" stop-color="#FFFFFF"/>
    <stop offset="72%" stop-color="#2CE0D0"/>
    <stop offset="100%" stop-color="#2CE0D0"/>
  </linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#37D8D0" opacity=".16"/>
  </pattern>
</defs>

<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<rect x="710" width="490" height="360" fill="url(#dots)" opacity=".8"/>

<!-- subtle diagonal lines -->
<g stroke="#52E2DA" stroke-width="1.2" opacity=".12" fill="none">
  <path d="M680 325 C820 245 930 165 1180 55"/>
  <path d="M735 350 C865 275 980 210 1200 120"/>
</g>

<!-- text -->
<text x="70" y="118" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">
  Tae Hoon <tspan fill="#2CE0D0">Kim</tspan>
</text>
<text x="70" y="174" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#F2F7FB">Software Engineer</text>
<text x="70" y="214" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#F2F7FB">Embedded Systems · Cyber Security</text>
<text x="70" y="272" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C9D8E4">Building reliable software through</text>
<text x="70" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#2CE0D0">problem analysis · automation · repeated validation</text>

